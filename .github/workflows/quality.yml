name: quality

# Read-only verification only: no job in this workflow writes to the repository,
# publishes a package or touches a release. Action versions are pinned to commit
# SHAs with the human-readable tag in a comment (supply-chain hygiene).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the package manager is package.json
  # ("packageManager"); the workflow repeats the exact version so a mismatch is
  # caught by tests/workflow-quality.test.mjs instead of drifting silently.
  PNPM_VERSION: 12.4.2

jobs:
  quality:
    name: quality (node 26.8.2 / macos)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm/action-setup 的 Windows 自安装器在 v11→v12 切换后会留下指向旧布局的
      # shim（pnpm 不可见），改为 npm 全局安装，三平台一致且少一个第三方 action。
      - name: Install pnpm
        run: npm install -g pnpm@12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Toolchain
        run: |
          node --version
          pnpm --version
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Syntax (current runtime)
        run: pnpm run check:syntax
      - name: Tests
        run: pnpm test
      - name: Markdown links
        run: pnpm run check:md-links
      - name: Suite must not rewrite the lockfile
        run: git diff --exit-code -- pnpm-lock.yaml

  compatibility:
    name: quality (node 24.15.0 / macos)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm/action-setup 的 Windows 自安装器在 v11→v12 切换后会留下指向旧布局的
      # shim（pnpm 不可见），改为 npm 全局安装，三平台一致且少一个第三方 action。
      - name: Install pnpm
        run: npm install -g pnpm@12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Minimum supported runtime: the contract this repository promises.
          node-version: 24.15.0
          cache: pnpm
      - name: Toolchain
        run: |
          node --version
          pnpm --version
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Syntax (minimum runtime)
        run: pnpm run check:syntax
      - name: Tests (minimum runtime)
        run: pnpm test

  windows:
    name: syntax + unit (node 26.8.2 / windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm/action-setup 的 Windows 自安装器在 v11→v12 切换后会留下指向旧布局的
      # shim（pnpm 不可见），改为 npm 全局安装，三平台一致且少一个第三方 action。
      - name: Install pnpm
        run: npm install -g pnpm@12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Syntax
        run: pnpm run check:syntax
      # The hook suite needs a POSIX shell and is verified on macOS; everything
      # else must pass on Windows too (path handling, git plumbing, yaml).
      # tests/workflow-quality.test.mjs 断言这份清单与 tests/ 实际文件一致：
      # 新增用例要么列在这里，要么在 macosOnly 表里说明原因（fail-closed）。
      - name: Tests (without the POSIX hook suite)
        run: >-
          node --test
          tests/node-contract.test.mjs
          tests/yaml.test.mjs
          tests/transaction.test.mjs
          tests/profiles.test.mjs
          tests/hooks-wiring.test.mjs
          tests/install.test.mjs
          tests/platform-portability.test.mjs
          tests/ci-platforms.test.mjs
          tests/managed-ownership.test.mjs
