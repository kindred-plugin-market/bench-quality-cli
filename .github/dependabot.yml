# Dependabot 周更：npm 依赖 + GitHub Actions。
# 策略（审计 md §5）：patch/minor 分组合并，major 独立 PR 单独评估；
# 本仓 pnpm 由 packageManager 锁定， Dependabot 只维护 dependencies 里的
# 运行时依赖与 devDependencies。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
